services:
  web:
    build:
      context: ./docker  # Cambiado para usar docker como contexto
      dockerfile: Dockerfile  # Ahora busca el Dockerfile en el contexto
    container_name: apache_php
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/apache-config:/etc/apache2/sites-available
      - ./docker/php.ini:/usr/local/etc/php/php.ini
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    depends_on:
      - db
    networks:
      - app-network
    restart: unless-stopped

  db:
    image: mariadb:10.4.32
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sistema_asistencia_matema
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass
    volumes:
      - ./docker/DB/data:/var/lib/mysql
      - ./docker/DB/init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "3307:3306"
    networks:
      - app-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8082:80"
    depends_on:
      - db
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
